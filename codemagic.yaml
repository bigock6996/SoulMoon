workflows:
  soul-moon-workflow:
    name: Build signed Soul Moon IPA
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Codemagic

    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: "SoulMoon.xcodeproj"
        XCODE_SCHEME: "SoulMoon"
        APP_BUNDLE_ID: "com.bigock6996.SoulMoon"
        EXTENSION_BUNDLE_ID: "com.bigock6996.SoulMoon.SoulMoonWidgetExtension"
      ios_signing:
        distribution_type: development
        bundle_identifier:
          - com.bigock6996.SoulMoon
          - com.bigock6996.SoulMoon.SoulMoonWidgetExtension

    scripts:
      - name: Enter SoulMoon project directory
        script: |
          set -euo pipefail

          if [ -d "SoulMoon" ] && [ -d "SoulMoon/SoulMoon.xcodeproj" ]; then
            cd SoulMoon
          fi

          echo "Using project directory: $(pwd)"
          test -d "$XCODE_PROJECT"
          xcodebuild -list -project "$XCODE_PROJECT"

      - name: Configure code signing
        script: |
          set -euo pipefail

          if [ -d "SoulMoon" ] && [ -d "SoulMoon/SoulMoon.xcodeproj" ]; then
            cd SoulMoon
          fi

          keychain initialize

          app-store-connect fetch-signing-files "$APP_BUNDLE_ID" \
            --type IOS_APP_DEVELOPMENT \
            --create

          app-store-connect fetch-signing-files "$EXTENSION_BUNDLE_ID" \
            --type IOS_APP_DEVELOPMENT \
            --create

          keychain add-certificates

          xcode-project use-profiles \
            --project "$XCODE_PROJECT"

      - name: Build signed IPA
        script: |
          set -euo pipefail

          if [ -d "SoulMoon" ] && [ -d "SoulMoon/SoulMoon.xcodeproj" ]; then
            cd SoulMoon
          fi

          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --configuration Release

      - name: Verify signed IPA structure and signatures
        script: |
          set -euo pipefail

          IPA_PATH=$(find "$CM_BUILD_DIR" \( -path "*/build/ios/ipa/*.ipa" -o -name "*.ipa" \) | head -n 1)
          echo "IPA path: $IPA_PATH"

          if [ -z "$IPA_PATH" ]; then
            echo "ERROR: No signed IPA found."
            exit 1
          fi

          VERIFY_DIR="$CM_BUILD_DIR/build/verify-ipa"
          rm -rf "$VERIFY_DIR"
          mkdir -p "$VERIFY_DIR"
          unzip -q "$IPA_PATH" -d "$VERIFY_DIR"

          APP_PATH="$VERIFY_DIR/Payload/SoulMoon.app"
          EXTENSION_PATH="$APP_PATH/PlugIns/SoulMoonWidgetExtension.appex"

          test -d "$APP_PATH"
          test -d "$EXTENSION_PATH"

          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_PATH/Info.plist" | grep -qx "$APP_BUNDLE_ID"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$EXTENSION_PATH/Info.plist" | grep -qx "$EXTENSION_BUNDLE_ID"

          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$EXTENSION_PATH"

          unzip -l "$IPA_PATH" | grep -q "Payload/SoulMoon.app/"
          unzip -l "$IPA_PATH" | grep -q "Payload/SoulMoon.app/PlugIns/SoulMoonWidgetExtension.appex/"

          mkdir -p "$CM_BUILD_DIR/build/signed-ipa"
          cp "$IPA_PATH" "$CM_BUILD_DIR/build/signed-ipa/SoulMoon.ipa"

          echo "Verified signed AltStore-compatible IPA:"
          echo "$CM_BUILD_DIR/build/signed-ipa/SoulMoon.ipa"

    artifacts:
      - build/signed-ipa/SoulMoon.ipa
      - build/ios/ipa/*.ipa
      - build/ios/archive/*.xcarchive
