```yaml
workflows:
  soul-moon-workflow:
    name: Build unsigned Soul Moon IPA
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: "SoulMoon.xcodeproj"
        XCODE_SCHEME: "SoulMoon"

    scripts:
      - name: Enter SoulMoon project directory
        script: |
          set -euo pipefail

          if [ -d "SoulMoon" ] && [ -d "SoulMoon/SoulMoon.xcodeproj" ]; then
            cd SoulMoon
          fi

          echo "Using project directory: $(pwd)"
          test -d "$XCODE_PROJECT"

          xcodebuild -list -project "$XCODE_PROJECT"

      - name: Build unsigned app
        script: |
          set -euo pipefail

          if [ -d "SoulMoon" ] && [ -d "SoulMoon/SoulMoon.xcodeproj" ]; then
            cd SoulMoon
          fi

          DERIVED_DATA_PATH="$CM_BUILD_DIR/DerivedData"

          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package unsigned IPA
        script: |
          set -euo pipefail

          DERIVED_DATA_PATH="$CM_BUILD_DIR/DerivedData"
          APP_PATH=$(find "$DERIVED_DATA_PATH" -path "*/Release-iphoneos/SoulMoon.app" -type d | head -n 1)

          IPA_ROOT="$CM_BUILD_DIR/build/ipa-root"
          IPA_PATH="$CM_BUILD_DIR/build/SoulMoon.ipa"

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No SoulMoon.app found."
            exit 1
          fi

          rm -rf "$IPA_ROOT"
          mkdir -p "$IPA_ROOT/Payload"

          cp -R "$APP_PATH" "$IPA_ROOT/Payload/SoulMoon.app"

          cd "$IPA_ROOT"

          zip -qry "$IPA_PATH" Payload

          echo "Unsigned IPA created at: $IPA_PATH"
          ls -lh "$IPA_PATH"

      - name: Verify IPA contents
        script: |
          set -euo pipefail

          IPA_PATH="$CM_BUILD_DIR/build/SoulMoon.ipa"
          VERIFY_DIR="$CM_BUILD_DIR/build/verify-ipa"

          rm -rf "$VERIFY_DIR"
          mkdir -p "$VERIFY_DIR"

          unzip -q "$IPA_PATH" -d "$VERIFY_DIR"

          test -d "$VERIFY_DIR/Payload/SoulMoon.app"
          test -f "$VERIFY_DIR/Payload/SoulMoon.app/SoulMoon"
          test -f "$VERIFY_DIR/Payload/SoulMoon.app/Info.plist"
          test -f "$VERIFY_DIR/Payload/SoulMoon.app/Assets.car"
          test -d "$VERIFY_DIR/Payload/SoulMoon.app/PlugIns"
          test -d "$VERIFY_DIR/Payload/SoulMoon.app/PlugIns/SoulMoonWidgetExtension.appex"

          echo "IPA verification passed."

          unzip -l "$IPA_PATH"

    artifacts:
      - build/SoulMoon.ipa
```
