workflows:
  soul-moon-workflow:
    name: Build Soul Moon IPA
    environment:
      vars:
        XCODE_PROJECT: "SoulMoon/SoulMoon.xcodeproj"
        XCODE_SCHEME: "SoulMoon"
    scripts:
      - name: Build unsigned app
        script: |
          xcodebuild -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath ./DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

          APP_PATH=$(find ./DerivedData -name "SoulMoon.app" -type d | head -n 1)
          echo "Found app at: $APP_PATH"

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app file found!"
            exit 1
          fi

      - name: Package as IPA
        script: |
          APP_PATH=$(find ./DerivedData -name "SoulMoon.app" -type d | head -n 1)

          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r SoulMoon.ipa Payload/

          unzip -l SoulMoon.ipa

    artifacts:
      - SoulMoon.ipa
