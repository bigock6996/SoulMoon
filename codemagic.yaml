workflows:
  soul-moon-workflow:
    name: Build unsigned Soul Moon IPA
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: "SoulMoon.xcodeproj"
        XCODE_SCHEME: "SoulMoon"
        APP_BUNDLE_ID: "com.bigock6996.SoulMoon"
        EXTENSION_BUNDLE_ID: "com.bigock6996.SoulMoon.SoulMoonWidgetExtension"

    scripts:
      - name: Enter SoulMoon project directory
        script: |
          set -euo pipefail

          if [ -d "SoulMoon" ] && [ -d "SoulMoon/SoulMoon.xcodeproj" ]; then
            cd SoulMoon
          fi

          echo "Using project directory: $(pwd)"
          test -d "$XCODE_PROJECT"
          xcodebuild -list -project "$XCODE_PROJECT"

      - name: Build unsigned app
        script: |
          set -euo pipefail

          if [ -d "SoulMoon" ] && [ -d "SoulMoon/SoulMoon.xcodeproj" ]; then
            cd SoulMoon
          fi

          DERIVED_DATA_PATH="$CM_BUILD_DIR/DerivedData"

          xcodebuild clean build \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

          APP_PATH=$(find "$DERIVED_DATA_PATH" -path "*/Release-iphoneos/SoulMoon.app" -type d | head -n 1)
          echo "Found app at: $APP_PATH"

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No SoulMoon.app found."
            exit 1
          fi

          EXTENSION_PATH="$APP_PATH/PlugIns/SoulMoonWidgetExtension.appex"

          test -d "$APP_PATH"
          test -f "$APP_PATH/SoulMoon"
          test -f "$APP_PATH/Info.plist"
          test -f "$APP_PATH/Assets.car"
          test -d "$APP_PATH/PlugIns"
          test -d "$EXTENSION_PATH"
          test -f "$EXTENSION_PATH/SoulMoonWidgetExtension"
          test -f "$EXTENSION_PATH/Info.plist"

          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_PATH/Info.plist" | grep -qx "$APP_BUNDLE_ID"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$EXTENSION_PATH/Info.plist" | grep -qx "$EXTENSION_BUNDLE_ID"

      - name: Package unsigned IPA
        script: |
          set -euo pipefail

          DERIVED_DATA_PATH="$CM_BUILD_DIR/DerivedData"
          APP_PATH=$(find "$DERIVED_DATA_PATH" -path "*/Release-iphoneos/SoulMoon.app" -type d | head -n 1)
          IPA_ROOT="$CM_BUILD_DIR/build/ipa-root"
          IPA_PATH="$CM_BUILD_DIR/build/SoulMoon.ipa"

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No SoulMoon.app found."
            exit 1
          fi

          rm -rf "$IPA_ROOT"
          mkdir -p "$IPA_ROOT/Payload"
          cp -R "$APP_PATH" "$IPA_ROOT/Payload/SoulMoon.app"

          cd "$IPA_ROOT"
          zip -qry "$IPA_PATH" Payload

          echo "Unsigned IPA created at: $IPA_PATH"
          ls -lh "$IPA_PATH"

      - name: Verify IPA contents
        script: |
          set -euo pipefail

          IPA_PATH="$CM_BUILD_DIR/build/SoulMoon.ipa"
          VERIFY_DIR="$CM_BUILD_DIR/build/verify-ipa"
